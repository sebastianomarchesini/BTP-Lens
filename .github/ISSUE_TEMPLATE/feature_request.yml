name: Feature request
description: A check, report format or workflow you would like to see
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your landscape?
      description: Describe the question, not the solution. "Which apps still run Node 16?" is perfect.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which CF role do you have?
      options:
        - Space Auditor
        - Org Auditor
        - Space Developer
        - I do not know
  - type: textarea
    id: context
    attributes:
      label: Anything else?
