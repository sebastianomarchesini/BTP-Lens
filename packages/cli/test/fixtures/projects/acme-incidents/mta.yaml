_schema-version: '3.1'
ID: acme-incidents
version: 1.0.0
description: Synthetic incident-desk sample (btp-lens test fixture)
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
modules:
  - name: acme-incidents-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: acme-incidents-auth
      - name: acme-incidents-db
  - name: acme-incidents-tools
    type: nodejs
    path: tools
    parameters:
      buildpack: https://poison-bp:POISON_bp_token@github.com/acme/buildpack.git
    properties:
      TOOLS_TOKEN: POISON_tools_token
    hooks:
      - name: before-start
        type: task
        parameters:
          command: echo POISON_hook
  - name: acme-incidents-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: acme-incidents-db
  - name: acme-incidents-local
    type: nodejs
    path: tools
    parameters:
      buildpack: /home/poison-user/POISON_bp_path/nodejs
resources:
  - name: acme-incidents-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: acme-incidents-${org}-${space}
        tenant-mode: dedicated
        service-key:
          name: POISON-service-key
        scopes:
          - name: $XSAPPNAME.mta-only
            description: declared in mta.yaml only, owner jane.poison@example.com
        role-templates:
          - name: MtaOnly
            description: declared in mta.yaml only
            scope-references:
              - $XSAPPNAME.mta-only
  - name: acme-incidents-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        database_id: 00000000-POIS-ON00-0000-000000000000
  - name: acme-incidents-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            destinations:
              - Name: backend
                URL: https://poison-internal.example.com
                Authentication: BasicAuthentication
                User: POISON_user
                Password: POISON_pw
